<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{.Title}}</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo-symbol.svg">
  <link rel="stylesheet" href="/assets/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-panel" aria-label="{{.LoginLabel}}">
      <img class="brand-wordmark" src="/assets/logo-wordmark.svg" alt="Baize" draggable="false">

      {{if .Error}}<div class="login-error" role="alert">
        <span aria-hidden="true">!</span>
        <p>{{.Error}}</p>
      </div>{{end}}

      <form method="post" action="/login">
        <label class="sr-only" for="password">{{.PasswordLabel}}</label>
        <div class="password-field">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6V4.7a3.5 3.5 0 0 1 7 0V6h.6A1.9 1.9 0 0 1 14 7.9v5.2a1.9 1.9 0 0 1-1.9 1.9H3.9A1.9 1.9 0 0 1 2 13.1V7.9A1.9 1.9 0 0 1 3.9 6h.6Zm1.4 0h4.2V4.7a2.1 2.1 0 0 0-4.2 0V6Z"/></svg>
          <input type="password" id="password" name="password" required autofocus autocomplete="current-password" placeholder="{{.PasswordLabel}}">
        </div>
        <button type="submit">{{.SubmitLabel}} <span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>
</body>
</html>
